name: Job Dependencies

on:
  workflow_dispatch:
    inputs:
      job1:
        description: 'Run Job 1'
        type: boolean
        required: true
        default: true
      job2:
        description: 'Run Job 2'
        type: boolean
        required: true
        default: true
      job3:
        description: 'Run Job 3'
        type: boolean
        required: true
        default: true

jobs:
  job1:
    runs-on: ubuntu-latest
    if: ${{ inputs.job1 }}
    steps:
      - name: Run Job 1
        run: echo "This is Job 1"

  job2:
    runs-on: ubuntu-latest
    if: ${{ inputs.job2 }}
    steps:
      - name: Run Job 2
        run: echo "This is Job 2, which depends on Job 1"

  job3:
    runs-on: ubuntu-latest
    needs:
      - job1
      - job2
    if: ${{ !cancelled() && inputs.job3 }}
    steps:
      - name: Run Job 3
        run: echo "This is Job 3, which depends on Job 2"
  
  debug:
    runs-on: ubuntu-latest
    needs:
      - job1
      - job2
      - job3
    if : ${{ always() }}
    steps:
      - name: Debug Job
        run: |
          echo "Job 1 status: ${{ needs.job1.result }}"
          echo "Job 2 status: ${{ needs.job2.result }}"
          echo "Job 3 status: ${{ needs.job3.result }}"
