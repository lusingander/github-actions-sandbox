name: Job Dependencies

on:
  workflow_dispatch:
    inputs:
      job1:
        description: 'Run Job 1'
        required: true
        default: 'true'
      job2:
        description: 'Run Job 2'
        required: true
        default: 'true'
      job3:
        description: 'Run Job 3'
        required: true
        default: 'true'

jobs:
  job1:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.job1 == 'true' }}
    steps:
      - name: Run Job 1
        run: echo "This is Job 1"

  job2:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.job2 == 'true' }}
    steps:
      - name: Run Job 2
        run: echo "This is Job 2, which depends on Job 1"

  job3:
    runs-on: ubuntu-latest
    needs:
      - job1
      - job2
    if: ${{ github.event.inputs.job3 == 'true' }}
    steps:
      - name: Run Job 3
        run: echo "This is Job 3, which depends on Job 2"